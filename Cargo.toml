[package]
name = "gibbon"
version = "0.1.0"
edition = "2024"
license = "MIT"
# `cargo run` starts the app; `src/bin/dev.rs` is the dev loop.
default-run = "gibbon"

[dependencies]
gpui-kit = { version = "0.6", features = ["tree-sitter-languages"] }
anyhow = "1"
chrono = "0.4"
dirs = "6"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
notify = "8"
ignore = "0.4"
