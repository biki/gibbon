[package]
name = "gibbon"
version = "0.1.0"
edition = "2024"
license = "MIT"
# `cargo run` starts the app; `src/bin/dev.rs` is the dev loop.
default-run = "gibbon"

[dependencies]
gpui-kit = { version = "0.7", features = ["tree-sitter-languages"] }
anyhow = "1"
chrono = "0.4"
dirs = "7"
futures = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
notify = "8"
ignore = "0.4"
# The grammars come with gpui-kit. Gibbon names them to register fixed
# highlight queries (src/highlight.rs). Keep the versions of Cargo.lock.
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cmake = "0.7"
tree-sitter-cpp = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"

# Debug builds optimize the dependencies. Unoptimized, GPUI needs about six
# times the work for each frame, and scrolling stutters. Gibbon itself stays
# unoptimized, so a rebuild after an edit still takes about 2 seconds.
[profile.dev.package."*"]
opt-level = 3
