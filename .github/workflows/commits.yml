name: Commits

# Quoted because YAML 1.1 reads a bare `on` as a boolean.
'on':
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Squash merges use the pull request title as the commit subject.
      - name: Pull request title
        if: github.event_name == 'pull_request'
        run: scripts/check-commit-subject.sh "$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}

      - name: Commit subjects
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="$AFTER^!"
          else
            range="$BEFORE..$AFTER"
          fi
          mapfile -t subjects < <(git log --no-merges --format=%s "$range")
          echo "Checking ${#subjects[@]} commit(s) in $range"
          [ "${#subjects[@]}" -eq 0 ] || scripts/check-commit-subject.sh "${subjects[@]}"
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
